name: Consent V2 integration gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  consent-v2:
    name: Consent V2 browser integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The final whitespace gate compares the checked-out commit with
          # its parent, which is unavailable with checkout's depth-one default.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Provision reproducible Chromium
        run: npx playwright-core install --with-deps chromium
      - name: Complete deterministic launch gate
        run: npm run validate
      - name: Compiled browser smoke
        run: npm run test:compiled-browser-smoke
      - name: Check whitespace errors
        run: git diff --check HEAD^
